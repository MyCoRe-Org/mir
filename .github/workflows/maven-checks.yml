name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: pr-checks-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: MyCoRe-Org/github-workflows/.github/workflows/maven-build.yml@v1
    with:
      java-version: '17'
      setup-browser: true
      project-setup: true
      maven-args: |
        --batch-mode -U -Djetty install
        --batch-mode -T1C javadoc:javadoc javadoc:test-javadoc
      failure-logs: |
        ./**/surefire-reports
        ./**/failsafe-reports
        ./**/screenshots
        ./**/*error*.log
        ./**/*test.log
        ~/.m2/repository/solr-*/server/logs/*.log
