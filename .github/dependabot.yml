version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "org.mycore*"
    groups:
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"
      maven:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/mir-layout"
      - "/mir-module"
      - "/mir-module/src/main/ts"
      - "/mir-webapp/src/main/vue/editor-tools"
      - "/mir-webapp/src/main/vue/name-search"
      - "/mir-wizard"
    schedule:
      interval: "monthly"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
